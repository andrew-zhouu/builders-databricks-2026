[build]
target = "x86_64-unknown-linux-musl"

# Static musl binary linked with the toolchain's own lld: no system C compiler needed.
# skylake-avx512 is the common subset of every scorer CPU (Cascade Lake or newer).
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-cpu=skylake-avx512", "-C", "target-feature=+crt-static"]
