[build]
target = "x86_64-unknown-linux-musl"

# Static musl binary linked with the toolchain's own lld: no system C compiler needed.
#
# target-cpu=skylake = AVX2 + BMI2 and deliberately no AVX-512: every scorer CPU
# (Cascade Lake or newer) has it, but 512-bit instructions lower the core's
# frequency licence on Cascade Lake, and with AVX-512 enabled LLVM fuses pairs
# of 256-bit compares into 512-bit ones on its own.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-cpu=skylake", "-C", "target-feature=+crt-static"]
