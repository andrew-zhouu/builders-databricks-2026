[package]
name = "sessions"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "sessions"
path = "src/main.rs"

[features]
# Microbenchmarks for the diagnostic image only (fast/src/probe.rs). Never part
# of a submission build.
probe = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
overflow-checks = false
